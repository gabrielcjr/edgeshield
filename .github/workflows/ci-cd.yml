name: CI & Docker Hub Publish

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

jobs:
  test:
    name: Run Pytest Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        run: pytest --cov=src --cov-report=term-missing

  publish:
    name: Build & Push EdgeShield to Docker Hub
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: DOCKERHUB
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (Multi-platform)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/edgeshield:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/edgeshield:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prune Old Docker Hub Tags (Keep Latest + 3 Most Recent)
        if: success()
        run: |
          echo "Authenticating with Docker Hub API..."
          TOKEN=$(curl -s -H "Content-Type: application/json" -X POST \
            -d "{\"username\": \"${{ secrets.DOCKERHUB_USERNAME }}\", \"password\": \"${{ secrets.DOCKERHUB_TOKEN }}\"}" \
            https://hub.docker.com/v2/users/login/ | jq -r .token)

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "⚠ Could not obtain Docker Hub API token. Skipping tag pruning."
            exit 0
          fi

          REPO="${{ secrets.DOCKERHUB_USERNAME }}/edgeshield"
          echo "Inspecting tags for $REPO..."
          TAGS_JSON=$(curl -s -H "Authorization: JWT $TOKEN" "https://hub.docker.com/v2/repositories/$REPO/tags/?page_size=100")
          TAGS_TO_DELETE=$(echo "$TAGS_JSON" | jq -r '[.results[] | select(.name != "latest") | .name] | .[3:][] // empty')

          if [ -z "$TAGS_TO_DELETE" ]; then
            echo "✔ No excess tags to delete for $REPO."
          else
            for TAG in $TAGS_TO_DELETE; do
              echo "Deleting old tag: $TAG"
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE -H "Authorization: JWT $TOKEN" "https://hub.docker.com/v2/repositories/$REPO/tags/$TAG/")
              if [ "$HTTP_STATUS" = "204" ] || [ "$HTTP_STATUS" = "200" ]; then
                echo "✔ Successfully deleted $TAG"
              else
                echo "⚠ Could not delete $TAG (HTTP $HTTP_STATUS - ensure Docker Hub token has Delete permission)"
              fi
            done
          fi

      - name: Update Kubernetes Manifest Tag & Push
        run: |
          sed -i "s|image: .*/edgeshield:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/edgeshield:${{ github.sha }}|g" k8s/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git diff --staged --quiet || (git commit -m "chore(gitops): update edgeshield image tag to ${{ github.sha }} [skip ci]" && git push origin HEAD)
